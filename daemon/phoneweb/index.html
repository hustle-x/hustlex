<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hustleX">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>hustleX</title>
<style>
/* The desktop app's dark palette (ui/theme/palette.go). */
:root{--ground:#000;--bg:#080808;--panel:#0b0b0b;--raised:#141414;--sunken:#050505;--sel:#171717;--border:#171717;--bstrong:#242424;
--text:#f0f0f0;--strong:#fff;--soft:#c4c4c4;--muted:#8a8a8a;--accent:#f2f2f2;--onaccent:#0a0a0a;
--done:#86d0a8;--warn:#e6c47e;--err:#ee8c8c;--working:#9db6f5;--claude:#d97757;--link:#b4a4f2;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100vh;overflow:hidden;overscroll-behavior:none;background:var(--ground);color:var(--text);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea{font-size:16px}
/* In a Home Screen app, with the status bar see-through, iOS leaves a dead
   band the status bar's height at the bottom when html and body are 100%
   tall (WebKit bug 301108): they are 100vh. fitApp sizes the page to the
   screen there, and to what the keyboard leaves (--app-h). */
.app{position:fixed;top:0;left:0;right:0;height:var(--app-h,100vh);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.ah{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;flex:none}
.lg{width:30px;height:30px;border-radius:8px;background:url(/icon-180.png) center/cover;flex:none}
.ah b{font-size:22px;font-weight:600}
.ah .cnt{color:var(--muted);font-size:14px;flex:1;white-space:nowrap}
.ah small{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px;max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ah small i{width:7px;height:7px;border-radius:4px;background:var(--done);flex:none}
.ab{flex:1;overflow-y:auto;padding:4px 12px 16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.ab>*{flex:none}
.empty{text-align:center;color:var(--muted);padding:60px 0}
/* agent tiles, as the session list's */
.av{width:34px;height:34px;border-radius:10px;background:var(--sel);border:1px solid var(--border);display:grid;place-items:center;flex:none;color:var(--soft)}
.av svg{width:58%;height:58%}
.av.claude{color:var(--claude)}
.av.s{width:26px;height:26px;border-radius:8px}
/* inbox */
.card{background:var(--raised);border:1px solid var(--border);border-radius:16px;padding:14px}
.top{display:flex;align-items:center;gap:10px;min-width:0}
.top>div{min-width:0;flex:1}
.top b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small,.sub{color:var(--muted);font-size:12.5px}
.q{margin-top:10px;color:var(--soft)}
code.blk{display:block;font:12.5px var(--mono);background:var(--sunken);border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-top:9px;color:var(--soft);white-space:pre-wrap;word-break:break-word}
.row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.row2 button{flex:1 1 auto;min-height:40px;padding:8px 12px;border-radius:11px;border:1px solid var(--bstrong);color:var(--soft)}
.row2 button.y{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:500}
/* sessions */
.filter{display:flex;align-items:center;gap:8px;margin:0 12px 6px;padding:0 12px;height:42px;border-radius:12px;border:1px solid var(--bstrong);background:var(--panel);flex:none}
.filter svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.filter input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text)}
.filter input::placeholder{color:var(--muted)}
.grp{display:flex;align-items:center;gap:8px;padding:12px 6px 4px;width:100%;text-align:left}
.grp svg{width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2.2;flex:none;transition:transform .2s}
.grp.shut svg{transform:rotate(-90deg)}
.grp span{font-size:12.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp em{font-style:normal;font-size:12.5px;color:var(--muted)}
.grp.need span,.grp.need em{color:var(--warn)}
.list{display:flex;flex-direction:column;gap:2px}
.srow{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;text-align:left;width:100%}
.srow:active{background:var(--sel)}
.srow>div{min-width:0;flex:1}
.srow b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow small{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;min-width:0}
.srow small span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .mem{color:var(--muted);font-size:13px;flex:none}
.dot{width:7px;height:7px;border-radius:4px;flex:none}
.dot.ring{background:none!important;border:1.5px solid currentColor}
/* tabs */
.tabs{display:flex;border-top:1px solid var(--border);background:rgba(10,10,10,.92);padding-bottom:env(safe-area-inset-bottom);flex:none}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;font-size:11px;color:var(--muted);position:relative}
.tabs button.on{color:var(--text)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bd{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--warn);color:#1a1300;font-size:10.5px;font-weight:600;display:grid;place-items:center}
/* a session, drawn as the agent's terminal */
.sh{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);flex:none}
.back{color:var(--soft);font-size:16px;padding:6px 4px;flex:none}
.tt{min-width:0;flex:1}.tt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tt small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term{flex:1;overflow-y:auto;background:#0a0a0a;padding:12px 0 8px;font:12.5px/1.55 var(--mono);color:var(--text);-webkit-overflow-scrolling:touch}
.term .u{background:#2c2c2c;padding:3px 12px 3px 28px;text-indent:-16px;white-space:pre-wrap;word-break:break-word;margin:14px 0 2px}
.term .u:first-child{margin-top:0}
.term .u::before{content:"❯ ";color:var(--muted)}
.term .a{padding:0 12px 0 28px;margin-top:12px;position:relative;white-space:pre-wrap;word-break:break-word}
.term .a::before{content:"●";position:absolute;left:12px;color:var(--strong)}
.term .a code{color:var(--link);font:inherit}
.term .a a{color:var(--link);text-decoration:none}
.term .a b{font-weight:700;color:var(--strong)}
.term .t{display:block;width:100%;text-align:left;padding:0 12px 0 28px;margin-top:12px;color:var(--muted);font:inherit}
.term .t .f{color:var(--err)}
.term .t i{font-style:normal;color:#5a5a5a}
.term .ti{padding:0 12px 0 44px;color:var(--muted);text-indent:-16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term .ti::before{content:"⎿  ";color:#5a5a5a}
.term .ti b{color:var(--soft);font-weight:600}
.term .ti.f b{color:var(--err)}
.term .busy{padding:0 12px;margin-top:14px;color:var(--claude)}
.term .busy::before{content:"✻ "}
.term .none{color:var(--muted);padding:40px 12px;text-align:center;font-family:var(--font)}
.cmp{flex:none;background:#0a0a0a;padding:6px 12px 8px}
.cmp .box{display:flex;align-items:flex-end;gap:8px;border-top:1px solid #3a3a3a;border-bottom:1px solid #3a3a3a;padding:8px 0}
.cmp .box::before{content:"❯";font:14px/24px var(--mono);color:var(--muted)}
.cmp textarea{flex:1;resize:none;min-height:24px;max-height:120px;background:none;border:0;color:var(--text);font:16px/24px var(--mono);outline:none}
.cmp textarea::placeholder{color:#555}
.send{width:30px;height:30px;border-radius:15px;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;flex:none}
.send svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.acct{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.acct b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.pl{border:1px solid var(--bstrong);border-radius:6px;padding:1px 6px;color:var(--soft);flex:none}
.acct .lim{overflow:hidden;text-overflow:ellipsis}
@media(max-width:430px){.acct .uses{display:none}}
/* credits */
.box2{background:var(--raised);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.arow{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.arow+.arow{border-top:1px solid var(--border)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who>div{flex:1;min-width:0}
.who b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--muted);font-size:12.5px}
.pace{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;font-size:12px;font-weight:700}
.pace.ok{background:rgba(134,208,168,.12);color:var(--done)}.pace.no{background:rgba(230,196,126,.13);color:var(--warn)}
.lims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lim1 .k{display:flex;font-size:11.5px;color:var(--muted);gap:4px}.lim1 .k span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lim1 .k b{color:var(--text);font-weight:500}
.lim1 small{display:block;color:var(--muted);font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{height:5px;background:var(--sel);border-radius:3px;margin-top:5px;overflow:hidden}.mt i{display:block;height:100%;border-radius:3px}
.anote{font-size:12px;color:var(--muted)}.aerr{font-size:12.5px;color:var(--warn)}
.sec{display:flex;align-items:center;gap:8px;margin:12px 4px 0;font-size:12px}
.sec span{color:var(--muted);letter-spacing:.06em}
.sec em{font-style:normal;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--sunken);border:1px solid var(--border);overflow-x:auto;flex:none;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:6px 11px;border-radius:8px;font-size:13px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;justify-content:center}
.seg button.on{background:var(--raised);color:var(--text);box-shadow:0 0 0 1px var(--bstrong)}
.seg svg{width:13px;height:13px}
.stats{display:grid;grid-template-columns:1fr 1fr}
.stat{display:flex;gap:10px;align-items:center;padding:12px;min-width:0}
.stat:nth-child(even){border-left:1px solid var(--border)}
.stat:nth-child(n+3){border-top:1px solid var(--border)}
.stat:last-child:nth-child(odd){grid-column:span 2}
.stat .ic{width:32px;height:32px;border-radius:9px;background:var(--sel);border:1px solid var(--bstrong);display:grid;place-items:center;flex:none}
.stat .ic svg{width:15px;height:15px;stroke:var(--soft);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stat b{display:block;font-size:18px;font-weight:500}
.stat small{color:var(--muted);font-size:11.5px;white-space:nowrap}
.up{color:var(--done)}.dn{color:var(--err)}
.ch{padding:14px}
.chh{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-width:0}
.chh svg.hi{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chh b{font-weight:500;font-size:14px;flex:1;white-space:nowrap}
.pill{font-size:11.5px;color:var(--soft);border:1px solid var(--bstrong);border-radius:8px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;align-items:flex-end;gap:3px;height:92px}
.bars>div{flex:1 1 0;min-width:0;border-radius:3px;overflow:hidden;display:flex;flex-direction:column}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sel);margin-bottom:10px}
.mixk{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.mixk div{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--soft);min-width:0}
.mixk i{width:7px;height:7px;border-radius:2px;flex:none}.mixk span{flex:1;white-space:nowrap}.mixk b{font-weight:500;color:var(--text)}
.saved{margin-top:10px;font-size:12px;color:var(--muted)}.saved b{color:var(--done);font-weight:500}
.tabs2{display:flex;gap:2px}
.tabs2 button{padding:3px 8px;border-radius:6px;font-size:12px;color:var(--muted)}.tabs2 button.on{background:var(--sel);color:var(--text)}
.wr{display:flex;align-items:center;gap:8px;padding:7px 2px;font-size:12.5px}
.wr+.wr{border-top:1px solid var(--border)}
.wr .nm{flex:1;min-width:0;display:flex;align-items:center;gap:7px}
.wr .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr .ti2{width:18px;height:18px;border-radius:5px;background:var(--sel);display:grid;place-items:center;flex:none;color:var(--muted)}
.wr .ti2 svg{width:11px;height:11px}.wr .ti2.claude{color:var(--claude)}
.wr .mt{width:40px;margin:0;flex:none}
.wr .n{color:var(--soft);text-align:right;flex:none}
.heat{display:flex;gap:3px;justify-content:space-between}
.heat>div{display:flex;flex-direction:column;gap:3px;flex:1}
.heat i{display:block;aspect-ratio:1;border-radius:2px;max-width:16px}
.lgd{display:flex;align-items:center;gap:3px;margin-top:8px;font-size:11px;color:var(--muted)}
.lgd i{width:9px;height:9px;border-radius:2px}
.foot{font-size:11.5px;color:var(--muted);margin:2px 4px 0}
/* pairing */
.pair{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 26px;gap:12px}
.pair .lg{width:64px;height:64px;border-radius:16px}
.pair h2{font-size:22px;font-weight:600}
.pair p{color:var(--muted);line-height:1.5}
.pair .code{font:600 30px var(--mono);letter-spacing:.12em;margin:6px 0}
.big{width:100%;max-width:320px;min-height:48px;border-radius:14px;background:var(--accent);color:var(--onaccent);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#222;border:1px solid var(--bstrong);border-radius:12px;padding:9px 14px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>

<div class="app" id="root"></div>
<div class="toast" id="toast"></div>

async function api(path,body){
  const r=await fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json","X-Hustlex":"1"},body:JSON.stringify(body),credentials:"same-origin"}:{credentials:"same-origin"});
  if(!r.ok){const e=new Error((await r.text()).trim()||r.statusText);e.status=r.status;throw e}
  return r.json()
}
function av(agent,small){return `<span class="av ${small?"s ":""}${esc(agent)}">${LOGO[agent]||esc((agent||"?")[0].toUpperCase())}</span>`}
function bytes(n){return n>=1<<30?(n/(1<<30)).toFixed(1)+" GB":n>=1<<20?Math.round(n/(1<<20))+" MB":n<1024?n+" B":(n>>10)+" KB"}
function until(t){const m=Math.floor((new Date(t)-Date.now())/60000);if(m<1)return"now";if(m<60)return m+"m";if(m<1440){const h=Math.floor(m/60);return m%60?h+"h "+(m%60)+"m":h+"h"}return Math.floor(m/1440)+"d"}
function resets(t){const d=new Date(t);if(d-Date.now()<864e5)return"in "+until(t);return d.toLocaleDateString("en",{weekday:"short"})+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function level(u){return u>90?"var(--err)":u>75?"var(--warn)":"var(--accent)"}

// Pairing: /pair?t=TOKEN, from the QR code the computer shows.
async function pairPage(){
  const token=new URLSearchParams(location.search).get("t")||"";
  const root=$("#root");
  try{
    const info=await api("/api/pair?t="+encodeURIComponent(token));
    root.innerHTML=`<div class="pair"><div class="lg"></div><h2>Pair this phone</h2>
      <p>with hustleX on <b style="color:var(--text)">${esc(info.host)}</b>.<br>Check the computer shows the same code.</p>
      <div class="code">${esc(info.code)}</div><button class="big" id="doPair">Pair</button></div>`;
    $("#doPair").onclick=async()=>{
      try{await api("/api/pair",{token,name:phoneName()});
        root.innerHTML=`<div class="pair"><div class="lg"></div><h2>Paired</h2><p style="color:var(--done)">✓ This phone can reach hustleX on ${esc(info.host)}.</p>
          <p>Add it to your Home Screen to open it like an app: Share, then Add to Home Screen.</p><button class="big" id="go">Open hustleX</button></div>`;
        $("#go").onclick=()=>location.replace("/");
        history.replaceState(null,"","/");
      }catch(e){toast(e.message)}
    };
  }catch(e){root.innerHTML=`<div class="pair"><div class="lg"></div><h2>Pair this phone</h2><p>${esc(e.message)}</p></div>`}
}
function phoneName(){const u=navigator.userAgent;return /iPhone/.test(u)?"iPhone":/iPad/.test(u)?"iPad":/Android/.test(u)?"Android phone":"Phone"}
function notPaired(){

async function refresh(){

  try{state=await api("/api/state");if(!open){$("#body")?renderBody():render()}}
  catch(e){if(e.status===401){clearInterval(timer);notPaired()}}
  if(tab==="credits"&&!open)loadHistory();
}
// render draws the page around the tab's body: its header, the filter, the tab bar.

  $("#root").innerHTML=`<div class="ah"><div class="lg"></div><b>${title}</b><span class="cnt">${cnt}</span><small><i></i>${esc(state.host)}</small></div>
   ${tab==="sessions"?`<label class="filter">${ICON.search}<input id="flt" type="search" placeholder="Filter sessions" value="${esc(filter)}" autocomplete="off"></label>`:""}
   <div class="ab" id="body"></div>
   <div class="tabs">

    <button data-t="sessions" class="${tab==="sessions"?"on":""}"><svg viewBox="0 0 24 24"><path d="M4 17l6-5-6-5M12 19h8"/></svg>Sessions</button>

function renderBody(){
  const body=$("#body");if(!body)return;
  const b=document.querySelector('[data-t="inbox"]'),n=state.inbox.length;
  if(b){const bd=b.querySelector(".bd");if(n&&!bd)b.insertAdjacentHTML("beforeend",`<span class="bd">${n}</span>`);else if(bd){if(n)bd.textContent=n;else bd.remove()}}
  const c=document.querySelector(".ah .cnt");if(c&&tab==="sessions")c.textContent=`${state.sessions.length} session${state.sessions.length===1?"":"s"}`;
  if(tab==="inbox")inboxBody(body);else if(tab==="sessions")sessionsBody(body);else creditsBody(body);
  body.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>openSession(b.dataset.o));
}

function inboxBody(body){
  const n=state.inbox.length;
  body.innerHTML=n?state.inbox.map((a,i)=>`<div class="card"><div class="top">${av(a.agent)}<div><b>${esc(a.name)}</b><small>${esc(a.project||"")}</small></div></div>
    <div class="q">${esc(a.question)}</div>${(a.detail||[]).length?`<code class="blk">${esc(a.detail.join("\n"))}</code>`:""}
    <div class="row2">${(a.choices||[]).map((c,j)=>`<button class="${j?"":"y"}" data-a="${i}" data-c="${j}">${esc(c.label)}</button>`).join("")}<button data-o="${esc(a.session)}">Open</button></div></div>`).join("")
    :`<div class="empty">✓ Nothing waiting on you.</div>`;
  body.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{
    const a=state.inbox[+b.dataset.a],c=a.choices[+b.dataset.c];
    try{await api("/api/answer",{session:a.session,key:c.key});toast(a.name+": "+c.label);state.inbox.splice(+b.dataset.a,1);renderBody()}catch(e){toast(e.message)}
  });
}

// Sessions, grouped by project as the desktop app's list.
function sessionRow(s){
  const col=COLORS[s.status]||"var(--muted)";
  return `<button class="srow" data-o="${esc(s.id)}">${av(s.agent)}<div><b>${esc(s.name)}</b>
    <small style="color:${col}"><i class="dot${s.hollow?" ring":""}" style="background:${col}"></i><span style="color:var(--muted)">${esc(s.label||s.status)}</span></small></div>${s.rss?`<span class="mem">${bytes(s.rss)}</span>`:""}</button>`
}
function summary(list){
  const wait=list.filter(s=>s.status==="needs you").length,work=list.filter(s=>s.status==="working").length;
  return wait?wait+" need input":work?work+" working":String(list.length)
}
function sessionsBody(body){
  const q=filter.trim().toLowerCase();
  const all=state.sessions.filter(s=>!q||[s.name,s.project,s.agent].some(f=>(f||"").toLowerCase().includes(q)));
  if(!all.length){body.innerHTML=`<div class="empty">${q?"No session matches.":"No sessions yet."}</div>`;return}
  const groups=[],byPath={};
  for(const p of state.projects||[]){const g={key:p.path,name:p.name,list:[]};byPath[p.path]=g;groups.push(g)}
  for(const s of all){let g=byPath[s.path];if(!g){g={key:s.path||"",name:s.project||"Other",list:[]};byPath[s.path]=g;groups.push(g)}g.list.push(s)}
  let html="";
  const waiting=all.filter(s=>s.status==="needs you");
  if(waiting.length)html+=`<div class="grp need"><span>Needs you</span><em>${waiting.length}</em></div><div class="list">${waiting.map(sessionRow).join("")}</div>`;
  for(const g of groups){
    if(!g.list.length)continue;
    const closed=shut[g.key]&&!q;
    html+=`<button class="grp${closed?" shut":""}" data-g="${esc(g.key)}">${ICON.chev}<span>${esc(g.name)}</span><em>${summary(g.list)}</em></button>`;
    if(!closed)html+=`<div class="list">${g.list.map(sessionRow).join("")}</div>`;
  }
  body.innerHTML=html;
  body.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const k=b.dataset.g;if(shut[k])delete shut[k];else shut[k]=1;saveShut();renderBody()});
}

// A session, drawn as its agent's terminal: prompts on a band, replies
// after a dot, tool calls summed up as the agent does, tapped open.
async function openSession(id){
  open=id;expanded.clear();
  $("#root").innerHTML=`<div class="sh"><button class="back" id="back">‹ Back</button><div class="tt"><b id="sName"></b><small id="sMeta"></small></div></div>
    <div class="term" id="chat"></div>
    <div class="cmp"><div class="box"><textarea id="msg" rows="1" placeholder="Message the agent…"></textarea><button class="send" id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></div>
    <div class="acct" id="who"></div>`;
  $("#back").onclick=()=>{open=null;render()};
  const msg=$("#msg");
  msg.oninput=()=>{msg.style.height="auto";msg.style.height=Math.min(msg.scrollHeight,120)+"px"};
  const send=async text=>{text=text.trim();if(!text)return;busy=true;
    try{await api("/api/send",{session:id,text});msg.value="";msg.oninput();toast("Sent");setTimeout(()=>loadSession(id),1200)}catch(e){toast(e.message)}finally{busy=false}};
  $("#send").onclick=()=>send(msg.value);
  await loadSession(id,true);
}
const VERBS={Bash:["ran","shell command","shell commands"],Read:["read","file","files"],Edit:["edited","file","files"],MultiEdit:["edited","file","files"],
  Write:["wrote","file","files"],NotebookEdit:["edited","notebook","notebooks"],Grep:["searched for","pattern","patterns"],Glob:["searched for","pattern","patterns"],
  LS:["listed","directory","directories"],WebFetch:["fetched","page","pages"],WebSearch:["searched the web","time","times"],Task:["ran","agent","agents"],Agent:["ran","agent","agents"]};
function toolSummary(run){
  const counts=new Map();let failed=0;
  for(const t of run){
    if(t.failed)failed++;
    const v=VERBS[t.text],key=v?v[0]+" "+v[2]:t.text==="TodoWrite"?"updated the to-dos":"used "+t.text;
    const c=counts.get(key)||{n:0,v};c.n++;counts.set(key,c);
  }
  const parts=[...counts].map(([k,c])=>c.v?`${c.v[0]} <b>${c.n}</b> ${c.n===1?c.v[1]:c.v[2]}`:k.startsWith("used ")&&c.n>1?`${esc(k)} ×${c.n}`:esc(k));
  let s=parts.join(", ");s=s.charAt(0).toUpperCase()+s.slice(1);
  return s+(failed?` <span class="f">· ${failed} failed</span>`:"")
}
function inline(t){
  return esc(t).replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>').replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>")
}
function terminal(s){
  const out=[],m=s.messages;
  for(let i=0;i<m.length;){
    const e=m[i];
    if(e.kind==="tool"){
      const run=[];while(i<m.length&&m[i].kind==="tool")run.push(m[i++]);
      const last=run[run.length-1],key=[run.length,run[0].text,run[0].detail,last.text,last.detail].join("|");
      const open=expanded.has(key);
      out.push(`<button class="t" data-k="${esc(key)}">${toolSummary(run)} <i>${open?"▾":"▸"}</i></button>`);
      if(open)out.push(run.map(t=>`<div class="ti${t.failed?" f":""}"><b>${esc(t.text)}</b> ${esc((t.detail||"").replace(/\s+/g," "))}</div>`).join(""));
      continue;
    }
    out.push(e.kind==="user"?`<div class="u">${esc(e.text)}</div>`:`<div class="a">${inline(e.text)}</div>`);
    i++;
  }
  if(s.status==="working")out.push(`<div class="busy">Working…</div>`);
  return out.length?out.join(""):`<div class="none">Nothing said yet.</div>`
}
function shortLabel(l){return l.replace(/^(\d+) hours$/,"$1h").replace(/^Week$/,"week").replace(/^Month$/,"month")}
async function loadSession(id,first){
  if(open!==id)return;
  try{
    const s=await api("/api/session?id="+encodeURIComponent(id));
    if(open!==id)return;
    $("#sName").textContent=s.name;$("#sMeta").textContent=[s.project,s.label||s.status].filter(Boolean).join(" · ");
    const w=(s.windows||[])[0];
    $("#who").innerHTML=s.account?`${av(s.agent,true)}<span class="uses">This session uses</span><b>${esc(s.account)}</b>${s.plan?`<span class="pl">${esc(s.plan)}</span>`:""}${w?`<span class="lim">${esc(shortLabel(w.label))} ${Math.round(w.used)}%${w.resetsAt?" · resets "+resets(w.resetsAt):""}</span>`:""}`:"";
    const chat=$("#chat"),atEnd=first||chat.scrollHeight-chat.scrollTop-chat.clientHeight<40;
    chat.innerHTML=terminal(s);
    wireTools(chat,s);
    if(atEnd)chat.scrollTop=chat.scrollHeight;
  }catch(e){if(e.status===401)notPaired();else toast(e.message)}
}
// wireTools opens and folds a run of tool calls when tapped.
function wireTools(chat,s){chat.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(expanded.has(k))expanded.delete(k);else expanded.add(k);chat.innerHTML=terminal(s);wireTools(chat,s)})}

// Credits, as the desktop app's page: each account's limits, then what
// the agents spent, read from their conversation files on the computer.
async function loadHistory(){
  if(histBusy||Date.now()-histAt<30000&&hist&&!hist.reading)return;
  histBusy=true;
  try{hist=await api("/api/history?days=91");histAt=Date.now();if(tab==="credits"&&!open)renderBody()}catch(e){}
  finally{histBusy=false}
}
function windowLength(l){
  if(l==="Week"||l.startsWith("Week ·"))return 7*864e5;if(l==="Month")return 30*864e5;
  let m=l.match(/^(\d+) hours$/);if(m)return +m[1]*36e5;m=l.match(/^(\d+) days$/);if(m)return +m[1]*864e5;return 0
}
function partOfDay(t){
  const h=t.getHours(),part=h>=5&&h<12?"morning":h>=12&&h<17?"afternoon":h>=17&&h<22?"evening":"night";
  if(t.toDateString()===new Date().toDateString())return part==="night"?"tonight":"this "+part;
  return t.toLocaleDateString("en",{weekday:"long"})+" "+part
}
function pace(a){
  let w=null,len=0;
  for(const x of a.windows||[]){const l=windowLength(x.label);if(l>len&&x.resetsAt&&!x.label.includes("·")){w=x;len=l}}
  if(!len)return null;
  const name=w.label==="Week"?"the week":"the "+w.label.toLowerCase();
  if(w.used>=100)return{ok:false,text:"Used up until "+name+" resets "+resets(w.resetsAt)};
  const elapsed=len-(new Date(w.resetsAt)-Date.now());
  if(elapsed<len/20||elapsed<=0)return{ok:true,text:`Just started: ${Math.round(w.used)}% of ${name} used`};
  const proj=w.used*len/elapsed;
  if(proj<=100)return{ok:true,text:`On track: about ${Math.round(proj)}% of ${name} by its reset`};
  return{ok:false,text:"At this pace "+name+" runs out "+partOfDay(new Date(Date.now()+elapsed*(100-w.used)/w.used))}
}
function accountsBox(){
  const accs=state.accounts||[];
  if(!accs.length)return`<div class="empty">No agent is signed in on ${esc(state.host)}.</div>`;
  return `<div class="box2">${accs.map(a=>{
    const p=pace(a);
    return `<div class="arow"><div class="who">${av(a.agent)}<div><b>${esc(a.account||a.agent)}</b><small>${esc(a.plan||a.agent)}</small></div>
      ${p?`<span class="pace ${p.ok?"ok":"no"}">${p.ok?"✓":"!"}</span>`:""}</div>
      ${p?`<div class="anote">${esc(p.text)}</div>`:""}
      ${(a.windows||[]).length?`<div class="lims">${a.windows.slice(0,3).map(w=>`<div class="lim1"><div class="k"><span>${esc(w.label)}</span><b>${Math.round(w.used)}%</b></div>
        <div class="mt"><i style="width:${Math.min(w.used,100)}%;background:${level(w.used)}"></i></div>
        <small>${w.resetsAt?"resets "+resets(w.resetsAt):esc(w.detail||"")}</small></div>`).join("")}</div>`:""}
      ${a.error?`<div class="aerr">${esc(a.error)}</div>`:""}${a.note?`<div class="anote">${esc(a.note)}</div>`:""}</div>`}).join("")}</div>`
}
// Claude's API prices per million tokens (ui/creditview/prices.go).
const PRICES=[["claude-fable-5-2",8,40,.2],["claude-mythos-5-2",8,40,.2],["claude-fable-5",10,50,1],["claude-mythos-5",10,50,1],["claude-opus-5-5",4,20,.2],
  ["claude-opus-",5,25,.5],["claude-sonnet-5-5",2,10,.1],["claude-sonnet-5",2,10,.2],["claude-sonnet-",3,15,.3],["claude-haiku-5-5",.1,.5,.01],["claude-haiku-",1,5,.1]];
const priceOf=m=>PRICES.find(p=>m.startsWith(p[0]));
const zero=()=>({input:0,cacheRead:0,cacheCreate:0,output:0,cost:0,unpriced:0,saved:0});
const total=u=>u.input+u.cacheRead+u.cacheCreate+u.output;
function addRow(u,r){
  const t={input:r.input||0,cacheRead:r.cacheRead||0,cacheCreate:r.cacheCreate||0,output:r.output||0};
  u.input+=t.input;u.cacheRead+=t.cacheRead;u.cacheCreate+=t.cacheCreate;u.output+=t.output;
  const p=priceOf(r.model||"");
  if(p){u.cost+=(t.input*p[1]+t.output*p[2]+t.cacheRead*p[3]+t.cacheCreate*p[1]*1.25)/1e6;u.saved+=t.cacheRead*(p[1]-p[3])/1e6}else u.unpriced+=total(t);
}
function merge(a,b){for(const k in b)a[k]+=b[k]}
const dayKey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const base=p=>(p||"").split("/").filter(Boolean).pop()||p||"";
function projectName(path){const p=(state.projects||[]).find(p=>p.path===path);return p?p.name:base(path)}
function spend(days){
  const today=new Date(),from=dayKey(addDays(today,-(days-1))),prevFrom=dayKey(addDays(today,-(2*days-1)));
  const chartDays=Math.max(days,14),chartFrom=addDays(today,-(chartDays-1)),chartKey=dayKey(chartFrom);
  const s={total:zero(),prev:zero(),convs:0,prevConvs:0,active:0,chart:[]};
  const byDay={},dayConvs={},convs=new Set(),prevConvs=new Set(),proj={},sess={},mod={};
  const share=(m,key,name,agent,u)=>{const x=m[key]||(m[key]={key,name,agent,...zero()});merge(x,u)};
  for(const r of hist.rows){
    const c=hist.conversations[r.conversation];if(!c)continue;
    if(acctFilter&&c.agent+" "+c.account!==acctFilter)continue;
    const u=zero();addRow(u,r);
    if(r.day>=chartKey){(byDay[r.day]||(byDay[r.day]=zero()));merge(byDay[r.day],u);(dayConvs[r.day]||(dayConvs[r.day]=new Set())).add(r.conversation)}
    if(r.day>=from){
      merge(s.total,u);convs.add(r.conversation);
      share(proj,c.project||"",projectName(c.project),c.agent,u);
      share(sess,c.session||c.agent+":"+r.conversation,c.title||"Conversation in "+base(c.project),"",u);
      share(mod,r.model,r.model,c.agent,u);
    }else if(r.day>=prevFrom){merge(s.prev,u);prevConvs.add(r.conversation)}
  }
  s.convs=convs.size;s.prevConvs=prevConvs.size;
  for(let i=0;i<chartDays;i++){
    const d=addDays(chartFrom,i),k=dayKey(d),u=byDay[k]||zero();
    if(i>=chartDays-days&&total(u)>0)s.active++;
    s.chart.push({day:d,u});
  }
  const sorted=m=>Object.values(m).sort((a,b)=>total(b)-total(a)||a.name.localeCompare(b.name));
  s.by=[sorted(proj),sorted(sess),sorted(mod)];
  return s
}
function tokens(n){return n>=1e9?(n/1e9).toFixed(1)+"B":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":String(n)}
function dollars(v){return v>=100?"$"+Math.round(v):"$"+v.toFixed(2)}
function change(now,before){if(!before)return"";const p=Math.round((now-before)/before*100);if(!p)return"";return p<0?`<span class="dn">▼${-p}%</span>`:`<span class="up">▲${p}%</span>`}
const KINDS=[["Cache read","#232323","cacheRead"],["Cache write","#7f7f7f","cacheCreate"],["Input","var(--working)","input"],["Output","var(--done)","output"]];
const fmtDay=d=>d.toLocaleDateString("en",{month:"short",day:"numeric"});
function spendingHtml(){
  const accs=(state.accounts||[]).filter(a=>a.ref);
  if(acctFilter&&!accs.some(a=>a.agent+" "+a.ref===acctFilter))acctFilter="";
  const who=acctFilter?(accs.find(a=>a.agent+" "+a.ref===acctFilter)||{}).account:"all accounts";
  let h=`<div class="sec"><span>SPENDING</span><em>${range===1?"today":"last "+range+" days"} · ${esc(who)}</em></div>
    <div class="seg" id="rng">${[[1,"Today"],[7,"7 days"],[30,"30 days"]].map(([d,l])=>`<button data-r="${d}" class="${d===range?"on":""}">${l}</button>`).join("")}</div>`;
  if(accs.length>1)h+=`<div class="seg" id="acf"><button data-f="" class="${acctFilter?"":"on"}">All accounts</button>${accs.map(a=>{const k=a.agent+" "+a.ref,n=(a.account||a.agent).split("@")[0];
    return `<button data-f="${esc(k)}" class="${k===acctFilter?"on":""}"><span style="color:${a.agent==="claude"?"var(--claude)":"inherit"};display:flex">${LOGO[a.agent]||""}</span>${esc(n)}</button>`}).join("")}</div>`;
  if(!hist||hist.reading&&!hist.rows.length)return h+`<div class="empty">Reading the agents' conversations on ${esc(state.host)}…</div>`;
  const s=spend(range);
  const stats=[[ICON.tokens,tokens(total(s.total)),"Tokens",change(total(s.total),total(s.prev))],[ICON.dollar,dollars(s.total.cost),"Est. cost",change(s.total.cost,s.prev.cost)],
    [ICON.term,s.convs,"Sessions",change(s.convs,s.prevConvs)],[ICON.cal,s.active+"/"+range,"Active days",""],
    [ICON.db,Math.round((s.total.cacheRead/Math.max(1,s.total.cacheRead+s.total.input+s.total.cacheCreate))*100)+"%","Cache hit",""]];
  h+=`<div class="box2 stats">${stats.map(([ic,v,l,c])=>`<div class="stat"><span class="ic">${ic}</span><div><b>${v}</b><small>${l} ${c}</small></div></div>`).join("")}</div>`;
  let most=s.chart[0];for(const d of s.chart)if(total(d.u)>total(most.u))most=d;
  const peak=total(most.u);
  h+=`<div class="box2 ch"><div class="chh">${ICON.chart}<b>Tokens per day</b>${peak?`<span class="pill">🔥 Busiest ${fmtDay(most.day)} · ${tokens(peak)}</span>`:""}</div>
    <div class="bars">${s.chart.map(d=>{const t=total(d.u);if(!t)return`<div style="height:2px;background:var(--sel)"></div>`;
      return `<div style="height:${Math.max(3,t/peak*92)}px">${KINDS.slice().reverse().map(k=>d.u[k[2]]?`<i style="flex:${d.u[k[2]]} 1 0;background:${k[1]}"></i>`:"").join("")}</div>`}).join("")}</div>
    <div class="axis"><span>${fmtDay(s.chart[0].day)}</span><span>Today</span></div></div>`;
  const tt=total(s.total);
  h+=`<div class="box2 ch"><div class="chh">${ICON.pie}<b>Token mix</b></div>
    <div class="mix">${KINDS.map(k=>s.total[k[2]]?`<i style="flex:${s.total[k[2]]} 1 0;background:${k[1]}"></i>`:"").join("")}</div>
    <div class="mixk">${KINDS.map(k=>`<div><i style="background:${k[1]}"></i><span>${k[0]}</span><b>${tokens(s.total[k[2]])}</b></div>`).join("")}</div>
    ${tt&&s.total.saved>=1?`<div class="saved">Cache saved about <b>${dollars(s.total.saved)}</b> vs reading it all as new input.</div>`:""}</div>`;
  const rows=s.by[by],top=rows.length?total(rows[0]):1;
  h+=`<div class="box2 ch"><div class="chh">${ICON.route}<b>Where it went</b><div class="tabs2" id="by">${["Projects","Sessions","Models"].map((l,i)=>`<button data-b="${i}" class="${i===by?"on":""}">${l}</button>`).join("")}</div></div>
    ${rows.length?rows.slice(0,6).map(r=>`<div class="wr"><div class="nm"><span class="ti2 ${esc(r.agent)}">${r.agent?LOGO[r.agent]||"":ICON.chat}</span><span>${esc(r.name)}</span></div>
      <div class="mt"><i style="width:${total(r)/Math.max(top,1)*100}%;background:var(--accent)"></i></div>
      <span class="n" style="width:34px;color:var(--muted)">${Math.round(total(r)/Math.max(tt,1)*100)}%</span><span class="n" style="width:46px">${tokens(total(r))}</span><span class="n" style="width:50px">${dollars(r.cost)}</span></div>`).join("")
      :`<div class="sub">No tokens in this range.</div>`}</div>`;
  h+=activityHtml();
  h+=`<div class="foot">Read from each agent's own conversation files on ${esc(state.host)}. Costs are estimates at API prices; a plan bills differently.</div>`;
  return h
}
function activityHtml(){
  const today=new Date();let start=addDays(today,-(13*7-1));start=addDays(start,-start.getDay());
  const tot={};for(const r of hist.rows)tot[r.day]=(tot[r.day]||0)+(r.input||0)+(r.cacheRead||0)+(r.cacheCreate||0)+(r.output||0);
  const days=[];for(let d=start;d<=today;d=addDays(d,1))days.push(tot[dayKey(d)]||0);
  const most=Math.max(1,...days);
  const lv=["var(--sel)","rgba(240,240,240,.16)","rgba(240,240,240,.32)","rgba(240,240,240,.58)","rgba(240,240,240,.9)"];
  const of=n=>{const f=n/most;return n===0?lv[0]:f<.2?lv[1]:f<.45?lv[2]:f<.75?lv[3]:lv[4]};
  let streak=0;for(let i=days.length-1;i>=0;i--){if(!days[i]){if(i===days.length-1)continue;break}streak++}
  let cols="";for(let w=0;w*7<days.length;w++)cols+=`<div>${days.slice(w*7,w*7+7).map(n=>`<i style="background:${of(n)}"></i>`).join("")}</div>`;
  return `<div class="box2 ch"><div class="chh">${ICON.calh}<b>Activity</b>${streak?`<span class="pill">🔥 ${streak}-day streak</span>`:""}</div>
    <div class="heat">${cols}</div><div class="lgd">Less ${lv.map(c=>`<i style="background:${c}"></i>`).join("")} More</div></div>`
}
function creditsBody(body){
  const y=body.scrollTop;
  body.innerHTML=accountsBox()+spendingHtml();
  body.scrollTop=y;
  body.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{range=+b.dataset.r;renderBody()});
  body.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{acctFilter=b.dataset.f;renderBody()});
  body.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{by=+b.dataset.b;renderBody()});
}

// fitApp sizes the page to the whole screen in a Home Screen app, and to
// what the keyboard leaves while it is up.
function fitApp(){
  if(!(navigator.standalone||matchMedia("(display-mode: standalone)").matches))return;
  const vv=window.visualViewport,full=innerWidth>innerHeight?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);
  const keyboard=vv&&vv.height<innerHeight-120;
  document.documentElement.style.setProperty("--app-h",(keyboard?Math.round(vv.height+vv.offsetTop):full)+"px");
}
fitApp();
